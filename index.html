<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chatbot</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; padding: 20px; }
    #chatbox { background: white; padding: 15px; border-radius: 5px; max-width: 600px; margin: auto; height: 400px; overflow-y: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .msg { margin: 10px 0; }
    .user { font-weight: bold; color: #00529B; }
    .bot { color: #4F8A10; }
    input[type="text"] { width: 80%; padding: 10px; font-size: 16px; }
    button { padding: 10px; font-size: 16px; }
  </style>
</head>
<body>

  <h2 style="text-align:center;">🧠 Chatbot Interface</h2>
  <div id="chatbox"></div>

  <div style="max-width:600px; margin:auto; margin-top:10px;">
    <input type="text" id="userInput" placeholder="Type a message..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    const functionUrl = 'https://mufxnrjfwk7mxudi3m765lcesa0akboh.lambda-url.us-east-1.on.aws/';

    const chatbox = document.getElementById('chatbox');
    const input = document.getElementById('userInput');

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = 'msg ' + sender;
      div.innerHTML = `<span class="${sender}">${sender === 'user' ? 'You' : 'Bot'}:</span> ${text}`;
      chatbox.appendChild(div);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, 'user');
      input.value = '';

      try {
        const response = await fetch(functionUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ user_prompt: message })
        });

        const data = await response.json();
        if (data.ai_reply) {
          addMessage(data.ai_reply, 'bot');
        } else {
          addMessage("⚠️ No reply from AI.", 'bot');
        }
      } catch (err) {
        console.error(err);
        addMessage("⚠️ Error calling the API.", 'bot');
      }
    }

    // Allow pressing Enter to send
    input.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>

</body>
</html>
